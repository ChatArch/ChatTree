[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatTree"
dynamic = ["version"]
description = "ChatTree: ChatArch placeholder package for PyPI name registration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.1.0,<0.2.0", "chatenv>=0.2.0,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chattree", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatTree"
Repository = "https://github.com/ChatArch/ChatTree"

[project.scripts]
chattree = "chattree.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]

[tool.setuptools.dynamic]
version = {attr = "chattree.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
